<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MKEF TIERS | اختبار الرانك</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1420;--surf:#161e2e;--line:#26324a;--text:#e8eefc;--muted:#8d9bb8;--acc:#5ad0ff;--accfg:#06202e;
--t1:#f2b01e;--t2:#c9d3e3;--t3:#d98a4a;--t4:#7fa6d9;--t5:#8793a8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f6fb;--surf:#fff;--line:#d9e1ef;--text:#121a2b;--muted:#55627e;--acc:#0a7fb5;--accfg:#fff}}
:root[data-theme="light"]{--bg:#f3f6fb;--surf:#fff;--line:#d9e1ef;--text:#121a2b;--muted:#55627e;--acc:#0a7fb5;--accfg:#fff}
:root[data-theme="dark"]{--bg:#0e1420;--surf:#161e2e;--line:#26324a;--text:#e8eefc;--muted:#8d9bb8;--acc:#5ad0ff;--accfg:#06202e}
html{scroll-padding-top:env(safe-area-inset-top,0px);color-scheme:light dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Readex Pro",system-ui,sans-serif;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.9rem;font-weight:700;margin:8px 0 4px}
h2{font-size:1.15rem;font-weight:700;margin:32px 0 12px}
p.sub{color:var(--muted);margin:0 0 20px}
.ladder{display:flex;overflow-x:auto;gap:6px;padding-bottom:6px}
.ladder span,.badge{flex:none;font-weight:700;font-size:.8rem;padding:2px 9px;border-radius:6px;color:#14161c;direction:ltr;display:inline-block}
.t1{background:var(--t1)}.t2{background:var(--t2)}.t3{background:var(--t3)}.t4{background:var(--t4)}.t5{background:var(--t5)}
.badge.lt{opacity:.72}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:20px 0 12px}
.tabs button{flex:none;font:inherit;font-size:.9rem;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surf);color:var(--muted);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:500}
input,select{font:inherit;width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surf);color:var(--text)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.board{margin-top:12px;border:1px solid var(--line);border-radius:12px;background:var(--surf);overflow:hidden}
.row{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.rk{font-weight:700;color:var(--muted);text-align:center}
.row:nth-child(-n+3) .rk{color:var(--t1)}
.nm{font-weight:500}.rg{color:var(--muted);font-size:.8rem;margin-inline-start:8px;direction:ltr;display:inline-block}
.bd{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.pt{font-weight:700;direction:ltr}
.empty{padding:20px;color:var(--muted);text-align:center}
form{display:grid;gap:10px;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
form button{font:inherit;font-weight:700;padding:12px;border:0;border-radius:8px;background:var(--acc);color:var(--accfg);cursor:pointer}
#msg{min-height:1.4em;color:var(--acc);margin:0}
.q{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.q:first-child{border-top:0}.q small{color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.board{scroll-behavior:smooth}}
</style>
</head>
<body>
<div class="wrap">
  <h1>MKEF TIERS</h1>
  <p class="sub">اختبر مستواك في الـ PvP واحصل على رانكك.</p>
  <div class="ladder" id="ladder" aria-label="سلم الرانكات"></div>

  <div class="tabs" id="tabs" role="group" aria-label="الأوضاع"></div>
  <input id="search" type="search" placeholder="ابحث عن لاعب" aria-label="ابحث عن لاعب">
  <div class="board" id="board"></div>

  <h2>اطلب اختبار</h2>
  <form id="form">
    <div class="two">
      <input id="fn" placeholder="اسم اللاعب في اللعبة" required maxlength="16" pattern="[A-Za-z0-9_]{3,16}" title="3 إلى 16 حرف إنجليزي أو رقم">
      <input id="fd" placeholder="Discord" required maxlength="40">
    </div>
    <div class="two">
      <select id="fm" aria-label="الوضع"></select>
      <select id="fr" aria-label="المنطقة"><option>ME</option><option>EU</option><option>NA</option><option>AS</option></select>
    </div>
    <button type="submit">أرسل الطلب</button>
    <p id="msg" role="status"></p>
  </form>
  <h2>قائمة الانتظار</h2>
  <div class="board" id="queue"></div>
</div>

<script>
// عدّل البيانات هنا: اللاعبين ورانكاتهم
const MODES=[["all","الكل"],["sword","Sword"],["crystal","Crystal"],["pot","Pot"],["axe","Axe"],["smp","SMP"],["mace","Mace"],["spearmace","Spear Mace"]];
const PTS={HT1:60,LT1:44,HT2:32,LT2:20,HT3:10,LT3:6,HT4:4,LT4:3,HT5:2,LT5:1};
let PLAYERS=[];
const $=id=>document.getElementById(id);
let mode="all",q="";
let queue=[];
try{queue=JSON.parse(localStorage.getItem("tt-queue")||"[]")}catch(e){queue=[]}

function badge(t){const s=document.createElement("span");s.className="badge t"+t[2]+(t[0]==="L"?" lt":"");s.textContent=t;return s}

$("ladder").append(...Object.keys(PTS).map(badge));
$("fm").innerHTML=MODES.slice(1).map(m=>`<option value="${m[0]}">${m[1]}</option>`).join("");

const tabs=$("tabs");
MODES.forEach(([k,l])=>{const b=document.createElement("button");b.type="button";b.textContent=l;b.setAttribute("aria-pressed",k===mode);b.onclick=()=>{mode=k;[...tabs.children].forEach(c=>c.setAttribute("aria-pressed",c===b));render()};tabs.append(b)});

function render(){
  const list=PLAYERS.map(p=>{
    const e=mode==="all"?Object.entries(p.t):(p.t[mode]?[[mode,p.t[mode]]]:[]);
    return{p,e,pts:e.reduce((s,[,t])=>s+PTS[t],0)}
  }).filter(x=>x.e.length&&x.p.n.toLowerCase().includes(q)).sort((a,b)=>b.pts-a.pts);
  const box=$("board");box.textContent="";
  if(!list.length){box.innerHTML='<div class="empty">ما فيه لاعبين في هذا الوضع بعد.</div>';return}
  list.forEach((x,i)=>{
    const r=document.createElement("div");r.className="row";
    const rk=document.createElement("div");rk.className="rk";rk.textContent=i+1;
    const mid=document.createElement("div");
    const nm=document.createElement("span");nm.className="nm";nm.textContent=x.p.n;
    const rg=document.createElement("span");rg.className="rg";rg.textContent=x.p.r;
    const bd=document.createElement("div");bd.className="bd";
    x.e.forEach(([m,t])=>{const b=badge(t);if(mode==="all")b.textContent=m+" "+t;bd.append(b)});
    mid.append(nm,rg,bd);
    const pt=document.createElement("div");pt.className="pt";pt.textContent=x.pts;
    r.append(rk,mid,pt);box.append(r)
  })
}
$("search").oninput=e=>{q=e.target.value.trim().toLowerCase();render()};

function renderQueue(){
  const box=$("queue");box.textContent="";
  if(!queue.length){box.innerHTML='<div class="empty">القائمة فاضية. كن أول واحد.</div>';return}
  queue.forEach((x,i)=>{
    const d=document.createElement("div");d.className="q";
    const a=document.createElement("span");a.textContent=(i+1)+". "+x.n;
    const b=document.createElement("small");b.textContent=x.m+" · "+x.r;
    d.append(a,b);box.append(d)
  })
}
$("form").onsubmit=e=>{
  e.preventDefault();
  const n=$("fn").value.trim();
  if(queue.some(x=>x.n.toLowerCase()===n.toLowerCase()&&x.m===$("fm").value)){$("msg").textContent="هذا اللاعب موجود في القائمة لنفس الوضع.";return}
  queue.push({n,m:$("fm").selectedOptions[0].textContent,r:$("fr").value});
  try{localStorage.setItem("tt-queue",JSON.stringify(queue))}catch(err){}
  $("msg").textContent="تم إرسال الطلب. انتظر دورك في القائمة.";
  e.target.reset();renderQueue()
};
async function load(){try{const r=await fetch("players.json?t="+Date.now(),{cache:"no-store"});if(r.ok){PLAYERS=await r.json();render()}}catch(e){}}
render();renderQueue();load();setInterval(load,60000);
</script>
</body>
</html>
