<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MKEF TIERS | اختبار الرانك</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&family=Readex+Pro:wght@300;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0d;--pn:#141417;--ln:#2b2b31;--tx:#f3f3f3;--mu:#9a9aa6;--gold:#f2b01e;--t1:#f2b01e;--t2:#c9d3e3;--t3:#d98a4a;--t4:#7fa6d9;--t5:#8793a8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{color-scheme:dark;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Pixelify Sans","Readex Pro",system-ui,sans-serif;line-height:1.5}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:2px solid var(--ln)}
.logo{font-size:1.5rem;font-weight:700;letter-spacing:1px;direction:ltr}.logo b{color:var(--gold)}
.mc{font:inherit;background:#707070;color:#fff;border:2px solid #000;box-shadow:inset 2px 2px 0 #b0b0b0,inset -2px -2px 0 #3f3f3f;padding:7px 16px;text-decoration:none;cursor:pointer;display:inline-block;text-shadow:2px 2px 0 #262626}
.mc:active{background:#5c5c5c}
.wrap{max-width:760px;margin:0 auto;padding:18px 14px 60px}
.hero{display:flex;gap:14px;align-items:center}
.hico{width:52px;height:52px;flex:none;background:#2a2410;border:2px solid #000;box-shadow:inset 2px 2px 0 #7a6320,inset -2px -2px 0 #1a1608;display:grid;place-items:center}
.hico .ic{width:34px;height:34px;margin:0}
h1{font-size:2.1rem;line-height:1.15;margin:0}.sub{color:var(--mu);margin:4px 0 0;font-size:.95rem}
.count{font-size:1.5rem;margin:18px 0 4px}.count span{color:var(--mu);font-size:1rem}
.hr{border-top:2px solid var(--ln);margin:12px 0}
.lbl{text-align:center;color:var(--mu);margin-bottom:6px}
.hotbar{display:flex;gap:4px;overflow-x:auto;padding:6px;background:#111;border:2px solid #000;box-shadow:inset 0 0 0 2px #3a3a3a}
.slot{flex:none;width:48px;height:48px;display:grid;place-items:center;background:#1d1d1f;border:2px solid #4a4a4e;cursor:pointer;padding:0}
.slot[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 2px #fff}
.slot .ic{width:32px;height:32px;margin:0}
.btns{display:flex;gap:8px;margin:14px 0}
.ic{width:24px;height:24px;object-fit:contain;vertical-align:-6px;margin-inline-end:6px}.ic.px{image-rendering:pixelated}
input,select{font:inherit;width:100%;padding:10px 12px;border:2px solid var(--ln);background:#0f0f11;color:var(--tx);border-radius:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.tbl,.board,form{background:var(--pn);border:2px solid var(--ln)}
.tbl{margin-top:10px}
.th{display:grid;grid-template-columns:30px 1fr auto;padding:8px 14px;color:var(--mu);border-bottom:2px solid var(--ln);font-size:.9rem}
.row{display:grid;grid-template-columns:28px 46px 1fr auto;gap:10px;align-items:start;padding:12px 14px;border-top:2px solid var(--ln)}
.row:first-child{border-top:0}
.rk{font-weight:700;color:var(--gold);padding-top:8px}
.av{width:44px;height:44px;image-rendering:pixelated;background:#222;border:2px solid #000}
.nm{font-weight:700;font-size:1.1rem;direction:ltr;display:inline-block}.rg{color:var(--mu);font-size:.8rem;margin-inline-start:8px;direction:ltr;display:inline-block}
.bd{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.badge{display:inline-flex;align-items:center;font-weight:700;font-size:.85rem;padding:1px 8px 1px 6px;color:#14161c;border:2px solid #000;direction:ltr}
.badge .ic{width:18px;height:18px;margin:0 4px 0 0;vertical-align:0}
.badge.lt{opacity:.8}.tx{font-size:.75rem;margin-inline-end:4px;color:inherit}.slot .tx,.hico .tx{font-size:.9rem;margin:0;color:var(--tx)}.more{color:var(--mu);align-self:center;font-size:.85rem}
.t1{background:var(--t1)}.t2{background:var(--t2)}.t3{background:var(--t3)}.t4{background:var(--t4)}.t5{background:var(--t5)}
.pt{font-weight:700;font-size:1.15rem;direction:ltr;padding-top:6px}
.empty{padding:20px;color:var(--mu);text-align:center}
h2{font-size:1.3rem;margin:34px 0 12px}
.ladder{display:flex;overflow-x:auto;gap:6px;padding-bottom:6px}
form{display:grid;gap:10px;padding:16px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
form .mc{width:100%;padding:11px}#msg{min-height:1.4em;margin:0;color:var(--gold)}
.q{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;border-top:2px solid var(--ln)}.q:first-child{border-top:0}.q small{color:var(--mu)}
</style>
</head>
<body>
<header class="top"><div class="logo">MKEF <b>TIERS</b></div><button id="snd" class="mc" type="button" aria-label="الصوت">🔊</button></header>
<main class="wrap">
 <section class="hero"><div class="hico" id="hico"></div><div><h1 id="ttl">الترتيب العام</h1><p class="sub" id="sub"></p></div></section>
 <div class="count"><b id="cnt">0</b> <span>لاعب</span></div>
 <div class="hr"></div>
 <div class="lbl" id="lbl">Overall</div>
 <div class="hotbar" id="tabs" role="group" aria-label="الأوضاع"></div>
 <div class="btns"><a class="mc" href="#test">اطلب اختبار</a><a class="mc" href="#legend">سلم الرانكات</a></div>
 <input id="search" type="search" placeholder="ابحث عن لاعب" aria-label="ابحث عن لاعب">
 <div class="tbl"><div class="th"><span>#</span><span>اللاعب</span><span>النقاط</span></div><div id="board"></div></div>
 <h2 id="legend">سلم الرانكات</h2><div class="ladder" id="ladder"></div>
 <h2 id="test">اطلب اختبار</h2>
 <form id="form">
  <div class="two"><input id="fn" placeholder="اسم اللاعب في اللعبة" required maxlength="16" pattern="[A-Za-z0-9_]{3,16}" title="3 إلى 16 حرف إنجليزي أو رقم"><input id="fd" placeholder="Discord" required maxlength="40"></div>
  <div class="two"><select id="fm" aria-label="الوضع"></select><select id="fr" aria-label="المنطقة"><option>ME</option><option>EU</option><option>NA</option><option>AS</option></select></div>
  <button class="mc" type="submit">أرسل الطلب</button><p id="msg" role="status"></p>
 </form>
 <h2>قائمة الانتظار</h2><div class="board" id="queue"></div>
</main>
<script>
const MODES=[["all","الكل"],["sword","Sword"],["axe","Axe"],["mace","Mace"],["spearmace","Spear Mace"],["uhc","UHC"],["nethpot","NethPot"],["pot","Pot"],["smp","SMP"],["diasmp","DiaSMP"],["crystal","Crystal"],["tntcart","TNT Cart"]];
const PTS={HT1:60,LT1:44,HT2:32,LT2:20,HT3:10,LT3:6,HT4:4,LT4:3,HT5:2,LT5:1};
let PLAYERS=[];
const $=id=>document.getElementById(id);
let mode="all",q="",queue=[];
try{queue=JSON.parse(localStorage.getItem("tt-queue")||"[]")}catch(e){queue=[]}
// أيقونات بكسل مرسومة بالكود (مو صور جاهزة)
const ICONS={};
function mk(fn){const c=document.createElement("canvas");c.width=c.height=16;const x=c.getContext("2d");fn((a,b,col)=>{x.fillStyle=col;x.fillRect(a,b,1,1)});return c.toDataURL()}
const DRAW={
 sword:p=>{for(let x=6;x<=13;x++){p(x,15-x,"#e8f1f8");p(x-1,15-x,"#9db3c6")}p(14,1,"#e8f1f8");[[3,8],[4,9],[5,10],[6,11],[7,12]].forEach(([a,b])=>p(a,b,"#d9a21b"));[[4,11],[3,12],[2,13]].forEach(([a,b])=>p(a,b,"#7a4a21"));p(1,14,"#d9a21b")},
 axe:p=>{for(let i=2;i<=11;i++)p(i,15-i,"#7a4a21");[[9,2],[10,2],[11,2],[8,3],[9,3],[10,3],[11,3],[12,3],[9,4],[10,4],[11,4],[12,4],[13,4],[10,5],[11,5],[12,5],[13,5],[11,6],[12,6]].forEach(([a,b],k)=>p(a,b,k%3?"#aab4bf":"#d6dde4"))},
 mace:p=>{for(let i=2;i<=9;i++)p(i,15-i,"#7a4a21");for(let a=9;a<=13;a++)for(let b=1;b<=5;b++)p(a,b,(a+b)%2?"#6b7480":"#8b95a1");[[11,0],[15,3],[8,3],[11,6]].forEach(([a,b])=>p(a,b,"#c8d0d8"))},
 spearmace:p=>{for(let i=1;i<=11;i++)p(i,15-i,"#7a4a21");[[12,3],[13,2],[14,1],[12,2],[13,3],[15,0]].forEach(([a,b])=>p(a,b,"#e8f1f8"));for(let a=8;a<=10;a++)for(let b=7;b<=9;b++)p(a,b,(a+b)%2?"#6b7480":"#8b95a1")},
 crystal:p=>{for(let a=0;a<16;a++)for(let b=0;b<16;b++){const d=Math.abs(a-7.5)+Math.abs(b-7.5);if(d<=6)p(a,b,d>5?"#6a1f8a":d>3?"#c04be0":d>1.5?"#e9a2f7":"#ffffff")}},
 pot:p=>{p(7,1,"#7a4a21");p(8,1,"#7a4a21");[[7,2],[8,2],[7,3],[8,3]].forEach(([a,b])=>p(a,b,"#cfe6f0"));for(let a=3;a<=12;a++)for(let b=4;b<=14;b++){const d=Math.hypot(a-7.5,b-9.5);if(d<=4.6)p(a,b,d>3.7?"#cfe6f0":(b>8?"#e0434f":"#cfe6f0"))}},
 smp:p=>{for(let a=2;a<14;a++)for(let b=3;b<15;b++){const n=(a*7+b*13)%5===0;p(a,b,b<6?(n?"#4f9d2f":"#6dbb45"):(n?"#6b4423":"#8a5a33"))}}
};
function ico(m){const i=document.createElement("img");i.className="ic";i.alt="";i.onerror=()=>{const t=document.createElement("span");t.className="tx";t.textContent=m==="all"?"★":m.slice(0,3).toUpperCase();i.replaceWith(t)};i.src=m+".png";return i}
DRAW.all=p=>{for(let i=3;i<=12;i++){p(7,i,"#f6e27a");p(8,i,"#f6e27a");p(i,7,"#f6e27a");p(i,8,"#f6e27a")}for(let i=5;i<=10;i++){p(i,i,"#ffd23f");p(i,15-i,"#ffd23f")}p(7,7,"#fff");p(8,8,"#fff");p(7,8,"#fff");p(8,7,"#fff")};
function badge(t,m){const s=document.createElement("span");s.className="badge t"+t[2]+(t[0]==="L"?" lt":"");s.textContent=t;if(m){const i=ico(m);if(i){s.prepend(i);s.title=m}}return s}
// صوت نقرة بسيط (مصنوع بالكود)
let snd=true,AC;try{snd=localStorage.getItem("mkef-snd")!=="0"}catch(e){}
function click(){if(!snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type="square";o.frequency.setValueAtTime(240,t);o.frequency.exponentialRampToValueAtTime(110,t+.06);g.gain.setValueAtTime(.07,t);g.gain.exponentialRampToValueAtTime(.001,t+.09);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.1)}catch(e){}}
document.addEventListener("click",e=>{if(e.target.closest("button,a,.slot"))click()},true);
$("snd").textContent=snd?"🔊":"🔇";
$("snd").onclick=()=>{snd=!snd;$("snd").textContent=snd?"🔊":"🔇";try{localStorage.setItem("mkef-snd",snd?"1":"0")}catch(e){}};

$("ladder").append(...Object.keys(PTS).map(k=>badge(k)));
$("fm").innerHTML=MODES.slice(1).map(m=>`<option value="${m[0]}">${m[1]}</option>`).join("");
MODES.forEach(([k,l])=>{const b=document.createElement("button");b.type="button";b.className="slot";b.title=l;b.setAttribute("aria-label",l);b.setAttribute("aria-pressed",k===mode);b.append(ico(k));b.onclick=()=>{mode=k;[...$("tabs").children].forEach(c=>c.setAttribute("aria-pressed",c===b));render()};$("tabs").append(b)});

function render(){
  const lab=MODES.find(m=>m[0]===mode)[1];
  $("ttl").textContent=mode==="all"?"الترتيب العام":lab;
  $("lbl").textContent=mode==="all"?"Overall":lab;
  $("sub").textContent=mode==="all"?"مرتب حسب نقاط الرانك في كل الأوضاع":"مرتب حسب الرانك في هذا الوضع";
  $("hico").replaceChildren(ico(mode));
  const list=PLAYERS.map(p=>{
    const e=Object.entries(p.t||{}).filter(([m])=>mode==="all"||m===mode).sort((a,b)=>(PTS[b[1]]||0)-(PTS[a[1]]||0));
    return{p,e,pts:e.reduce((s,[,t])=>s+(PTS[t]||0),0)}
  }).filter(x=>x.e.length&&x.p.n.toLowerCase().includes(q)).sort((a,b)=>b.pts-a.pts);
  $("cnt").textContent=list.length;
  const box=$("board");box.textContent="";
  if(!list.length){box.innerHTML='<div class="empty">ما فيه لاعبين في هذا الوضع بعد.</div>';return}
  list.forEach((x,i)=>{
    const r=document.createElement("div");r.className="row";
    const rk=document.createElement("div");rk.className="rk";rk.textContent=i+1;
    const av=document.createElement("img");av.className="av";av.alt="";av.loading="lazy";av.src="https://minotar.net/avatar/"+encodeURIComponent(x.p.n)+"/64";av.onerror=()=>{av.style.visibility="hidden"};
    const mid=document.createElement("div");
    const nm=document.createElement("span");nm.className="nm";nm.textContent=x.p.n;
    const rg=document.createElement("span");rg.className="rg";rg.textContent=x.p.r||"";
    const bd=document.createElement("div");bd.className="bd";
    x.e.slice(0,6).forEach(([m,t])=>bd.append(badge(t,m)));
    if(x.e.length>6){const mo=document.createElement("span");mo.className="more";mo.textContent="+"+(x.e.length-6);bd.append(mo)}
    mid.append(nm,rg,bd);
    const pt=document.createElement("div");pt.className="pt";pt.textContent=x.pts;
    r.append(rk,av,mid,pt);box.append(r)
  })
}
$("search").oninput=e=>{q=e.target.value.trim().toLowerCase();render()};
function renderQueue(){
  const box=$("queue");box.textContent="";
  if(!queue.length){box.innerHTML='<div class="empty">القائمة فاضية. كن أول واحد.</div>';return}
  queue.forEach((x,i)=>{
    const d=document.createElement("div");d.className="q";
    const a=document.createElement("span");a.textContent=(i+1)+". "+x.n;
    const b=document.createElement("small");b.textContent=x.m+" · "+x.r;
    d.append(a,b);box.append(d)
  })
}
$("form").onsubmit=e=>{
  e.preventDefault();
  const n=$("fn").value.trim();
  if(queue.some(x=>x.n.toLowerCase()===n.toLowerCase()&&x.m===$("fm").value)){$("msg").textContent="هذا اللاعب موجود في القائمة لنفس الوضع.";return}
  queue.push({n,m:$("fm").selectedOptions[0].textContent,r:$("fr").value});
  try{localStorage.setItem("tt-queue",JSON.stringify(queue))}catch(err){}
  $("msg").textContent="تم إرسال الطلب. انتظر دورك في القائمة.";
  e.target.reset();renderQueue()
};
async function load(){try{const r=await fetch("players.json?t="+Date.now(),{cache:"no-store"});if(r.ok){PLAYERS=await r.json();render()}}catch(e){}}
render();renderQueue();load();setInterval(load,60000);
</script>
</body>
</html>
