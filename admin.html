<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>لوحة التحكم | MKEF TIERS</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1420;--surf:#161e2e;--line:#26324a;--text:#e8eefc;--muted:#8d9bb8;--acc:#5ad0ff;--accfg:#06202e;--danger:#ff6b6b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f6fb;--surf:#fff;--line:#d9e1ef;--text:#121a2b;--muted:#55627e;--acc:#0a7fb5;--accfg:#fff;--danger:#c62828}}
:root[data-theme="light"]{--bg:#f3f6fb;--surf:#fff;--line:#d9e1ef;--text:#121a2b;--muted:#55627e;--acc:#0a7fb5;--accfg:#fff;--danger:#c62828}
:root[data-theme="dark"]{--bg:#0e1420;--surf:#161e2e;--line:#26324a;--text:#e8eefc;--muted:#8d9bb8;--acc:#5ad0ff;--accfg:#06202e;--danger:#ff6b6b}
html{scroll-padding-top:env(safe-area-inset-top,0px);color-scheme:light dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Readex Pro",system-ui,sans-serif;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.6rem;margin:8px 0 4px}h2{font-size:1.05rem;margin:28px 0 10px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px}
input,select{font:inherit;width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;font-weight:700;padding:11px 14px;border:0;border-radius:8px;background:var(--acc);color:var(--accfg);cursor:pointer}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:500}
button:disabled{opacity:.45;cursor:default}
.row{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.nm{font-weight:700;cursor:pointer;direction:ltr;display:inline-block}
.rg{color:var(--muted);font-size:.8rem;direction:ltr;display:inline-block;margin-inline-start:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 6px 2px 10px;font-size:.85rem;direction:ltr}
.chip button{padding:0 6px;background:none;color:var(--danger);font-size:1rem;line-height:1.4}
.del{background:none;color:var(--danger);padding:4px 8px}
#msg{min-height:1.5em;margin:10px 0 0}
.ok{color:var(--acc)}.err{color:var(--danger)}
.bar{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);margin-top:18px}
.bar button{width:100%;padding:14px;box-shadow:0 6px 20px rgba(0,0,0,.3)}
small{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <h1>لوحة التحكم</h1>
  <p class="sub">عدّل اللاعبين والرانكات، والموقع والمود يتحدثون تلقائياً.</p>

  <section id="login" class="card">
    <input id="repo" value="Polpks/MKEFTIERS" dir="ltr" aria-label="المشروع" autocomplete="off">
    <input id="token" type="password" dir="ltr" placeholder="التوكن (Token)" aria-label="التوكن" autocomplete="off">
    <button id="enter" type="button">دخول</button>
    <small>التوكن ينحفظ في متصفحك أنت بس، ولا أحد غيرك يقدر يعدل بدونه.</small>
    <p id="lmsg" class="err" role="status"></p>
  </section>

  <section id="panel" hidden>
    <div class="card">
      <div class="two">
        <input id="fn" dir="ltr" maxlength="16" placeholder="اسم اللاعب" aria-label="اسم اللاعب" autocapitalize="off">
        <select id="fr" aria-label="المنطقة"><option>ME</option><option>EU</option><option>NA</option><option>AS</option></select>
      </div>
      <div class="two">
        <select id="fm" aria-label="الوضع"></select>
        <select id="ft" aria-label="الرانك"></select>
      </div>
      <button id="add" type="button">أضف / حدّث</button>
    </div>

    <h2>اللاعبين <small id="count"></small></h2>
    <div id="list"></div>

    <div class="bar"><button id="save" type="button" disabled>احفظ التغييرات</button><p id="msg" role="status"></p></div>
    <p><button id="out" class="ghost" type="button">تسجيل خروج</button></p>
  </section>
</div>

<script>
const MODES=[["sword","Sword"],["crystal","Crystal"],["pot","Pot"],["axe","Axe"],["smp","SMP"],["mace","Mace"],["spearmace","Spear Mace"]];
const TIERS=["HT1","LT1","HT2","LT2","HT3","LT3","HT4","LT4","HT5","LT5"];
const $=id=>document.getElementById(id);
let repo="",token="",players=[],sha="",dirty=false;

$("fm").innerHTML=MODES.map(m=>`<option value="${m[0]}">${m[1]}</option>`).join("");
$("ft").innerHTML=TIERS.map(t=>`<option>${t}</option>`).join("");

try{token=localStorage.getItem("mkef-token")||"";repo=localStorage.getItem("mkef-repo")||""}catch(e){}
if(repo)$("repo").value=repo;
if(token){$("token").value=token;enter()}

function b64dec(b){const bin=atob(b.replace(/\s/g,""));return new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0)))}
function b64enc(s){const u=new TextEncoder().encode(s);let bin="";for(let i=0;i<u.length;i++)bin+=String.fromCharCode(u[i]);return btoa(bin)}
function api(method,body){
  return fetch(`https://api.github.com/repos/${repo}/contents/players.json`,{
    method,cache:"no-store",
    headers:{Authorization:"Bearer "+token,Accept:"application/vnd.github+json","Content-Type":"application/json"},
    body:body?JSON.stringify(body):undefined
  });
}
function explain(status){
  if(status===401)return "التوكن غلط أو منتهي.";
  if(status===403)return "ما عندك صلاحية، أو GitHub حاظرك مؤقتاً. جرب بعد شوي.";
  if(status===404)return "ما لقيت المشروع أو الملف. تأكد من اسم المشروع ومن صلاحيات التوكن.";
  if(status===409||status===422)return "الملف تغير من مكان ثاني. أعد تحميل الصفحة.";
  return "صار خطأ ("+status+").";
}

async function enter(){
  repo=$("repo").value.trim();token=$("token").value.trim();
  if(!repo||!token){$("lmsg").textContent="اكتب المشروع والتوكن.";return}
  $("lmsg").textContent="";
  try{
    const r=await api("GET");
    if(!r.ok){$("lmsg").textContent=explain(r.status);return}
    const j=await r.json();
    sha=j.sha;players=JSON.parse(b64dec(j.content));
    try{localStorage.setItem("mkef-token",token);localStorage.setItem("mkef-repo",repo)}catch(e){}
    $("login").hidden=true;$("panel").hidden=false;render();
  }catch(e){$("lmsg").textContent="ما قدرت أقرأ الملف. تأكد من الإنترنت ومن صيغة players.json."}
}
$("enter").onclick=enter;
$("out").onclick=()=>{try{localStorage.removeItem("mkef-token")}catch(e){}location.reload()};

function setDirty(v){dirty=v;$("save").disabled=!v}
function say(t,cls){const m=$("msg");m.textContent=t;m.className=cls||""}

function render(){
  const box=$("list");box.textContent="";
  $("count").textContent="("+players.length+")";
  players.forEach((p,i)=>{
    const row=document.createElement("div");row.className="row";
    const top=document.createElement("div");top.className="top";
    const l=document.createElement("div");
    const nm=document.createElement("span");nm.className="nm";nm.textContent=p.n;
    nm.onclick=()=>{$("fn").value=p.n;$("fr").value=p.r||"ME";window.scrollTo({top:0,behavior:"smooth"})};
    const rg=document.createElement("span");rg.className="rg";rg.textContent=p.r||"";
    l.append(nm,rg);
    const del=document.createElement("button");del.className="del";del.textContent="حذف اللاعب";
    del.onclick=()=>{if(confirm("حذف "+p.n+"؟")){players.splice(i,1);setDirty(true);render()}};
    top.append(l,del);
    const chips=document.createElement("div");chips.className="chips";
    Object.entries(p.t||{}).forEach(([m,t])=>{
      const c=document.createElement("span");c.className="chip";
      c.append(document.createTextNode(m+" "+t));
      const x=document.createElement("button");x.type="button";x.textContent="×";x.setAttribute("aria-label","حذف "+m);
      x.onclick=()=>{delete p.t[m];if(!Object.keys(p.t).length)players.splice(i,1);setDirty(true);render()};
      c.append(x);chips.append(c);
    });
    row.append(top,chips);box.append(row);
  });
  if(!players.length){const e=document.createElement("p");e.className="sub";e.textContent="ما فيه لاعبين.";box.append(e)}
}

$("add").onclick=()=>{
  const n=$("fn").value.trim();
  if(!/^[A-Za-z0-9_]{3,16}$/.test(n)){say("الاسم لازم 3 إلى 16 حرف إنجليزي أو رقم أو _","err");return}
  const m=$("fm").value,t=$("ft").value,r=$("fr").value;
  let p=players.find(x=>x.n.toLowerCase()===n.toLowerCase());
  if(!p){p={n,r,t:{}};players.push(p)}
  p.r=r;p.t=p.t||{};p.t[m]=t;
  $("fn").value="";setDirty(true);say("");render();
};

$("save").onclick=async()=>{
  $("save").disabled=true;say("جاري الحفظ...");
  const text="[\n"+players.map(p=>"  "+JSON.stringify(p)).join(",\n")+"\n]\n";
  try{
    const r=await api("PUT",{message:"Update players",content:b64enc(text),sha});
    if(!r.ok){say(explain(r.status),"err");$("save").disabled=false;return}
    const j=await r.json();sha=j.content.sha;setDirty(false);
    say("تم الحفظ. الموقع يتحدث خلال دقيقة، والمود خلال 5 دقائق.","ok");
  }catch(e){say("ما قدرت أحفظ. تأكد من الإنترنت.","err");$("save").disabled=false}
};
</script>
</body>
</html>
